<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathable Systems · 文献精读工作台</title>
<style>
:root{
  --paper:#f5f2ea;
  --paper-2:#efeade;
  --card:#fffdf8;
  --ink:#1f2328;
  --ink-2:#3f4650;
  --muted:#8b8577;
  --line:#e5dfd1;
  --line-2:#d8d1c0;
  --accent:#155e56;
  --accent-2:#0d3f3a;
  --accent-soft:#e6efeb;
  --gold:#a9814a;
  --danger:#a03a2b;
  --serif:"Source Han Serif SC","Noto Serif SC","Songti SC",STSong,"SimSun",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;color:var(--ink);background:var(--paper);
  background-image:radial-gradient(900px 500px at 12% -10%,#fbf9f2 0%,rgba(251,249,242,0) 60%),
                   radial-gradient(800px 420px at 100% 0%,#f2efe4 0%,rgba(242,239,228,0) 55%);
  font-family:var(--sans);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none;}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.01em;margin:0;}
p{margin:0;}
button{font-family:inherit;}
::selection{background:#dcebe4;}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;height:66px;display:flex;align-items:center;
  justify-content:space-between;gap:18px;padding:0 26px;
  background:rgba(248,245,237,.88);backdrop-filter:saturate(1.2) blur(12px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;}
.brand .mark{
  width:36px;height:36px;flex:none;border-radius:10px;border:1px solid rgba(21,94,86,.35);
  background:linear-gradient(160deg,#fdfcf7,#e9f0ec);display:grid;place-items:center;color:var(--accent);
}
.brand h1{font-size:16.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.brand p{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:1px;}
.top-actions{display:flex;align-items:center;gap:8px;}
.save-state{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-right:4px;}
.save-state b{color:var(--accent);font-weight:600;}

/* ---------- layout ---------- */
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 66px);}
.sidebar{
  width:292px;flex:none;position:sticky;top:66px;height:calc(100vh - 66px);
  overflow-y:auto;padding:16px 14px 30px;border-right:1px solid var(--line);
  background:rgba(250,247,240,.55);
}
.sidebar::-webkit-scrollbar{width:8px;}
.sidebar::-webkit-scrollbar-thumb{background:#dfd8c8;border-radius:8px;border:2px solid transparent;background-clip:content-box;}
.nav{display:flex;flex-direction:column;gap:2px;}
.nav-item{
  display:flex;align-items:center;gap:10px;height:36px;padding:0 11px;border-radius:9px;
  font-size:13.5px;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;
  user-select:none;
}
.nav-item svg{flex:none;opacity:.75;}
.nav-item:hover{background:rgba(31,35,40,.045);}
.nav-item.active{
  background:var(--card);color:var(--accent);font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent),0 1px 2px rgba(31,35,40,.04);
}
.nav-item.active svg{opacity:1;}
.nav-item .count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums;}
.nav-item.active .count{color:var(--accent);}

.side-sec{margin-top:22px;}
.side-head{display:flex;align-items:center;justify-content:space-between;padding:0 8px;margin-bottom:8px;}
.side-head span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
.side-head button{
  width:22px;height:22px;border-radius:6px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-2);cursor:pointer;display:grid;place-items:center;padding:0;
}
.side-head button:hover{border-color:var(--accent);color:var(--accent);}
.search-wrap{position:relative;margin:0 2px 8px;}
.search-wrap svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);}
.search-wrap input{
  width:100%;height:34px;padding:0 10px 0 31px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;color:var(--ink);outline:none;
}
.search-wrap input:focus{border-color:rgba(21,94,86,.5);box-shadow:0 0 0 3px rgba(21,94,86,.07);}
.paper-list{display:flex;flex-direction:column;gap:3px;}
.paper-item{padding:9px 10px;border-radius:9px;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;}
.paper-item:hover{background:rgba(255,255,255,.65);}
.paper-item.active{background:var(--card);border-color:var(--line);box-shadow:0 1px 2px rgba(31,35,40,.035);}
.paper-item .t{
  font-size:12.8px;line-height:1.45;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.paper-item .m{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:var(--muted);white-space:nowrap;min-width:0;}
.paper-item .m .st{flex:none;}
.paper-item .m .sec{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;color:#a29a87;}
.paper-item .m .sec::before{content:"· ";color:#bdb5a3;}
.paper-item .m .time{flex:none;margin-left:auto;color:#a29a87;}
.paper-item .dot{width:6px;height:6px;border-radius:50%;background:#b9b2a2;flex:none;}
.dot.st-reading{background:#b98b3a;}
.dot.st-read{background:#3f7f6f;}
.dot.st-final{background:#155e56;}
.dot.st-pause{background:#b0a99a;}
.side-foot{margin-top:20px;padding:12px 10px 0;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);line-height:1.7;}

/* ---------- main ---------- */
main{flex:1;min-width:0;max-width:1080px;margin:0 auto;padding:34px 46px 90px;}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:7px;}
.page-title{font-size:27px;line-height:1.3;}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:7px;max-width:640px;}
.page-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:9px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);
  font-size:12.5px;cursor:pointer;white-space:nowrap;transition:all .15s;text-decoration:none;
}
.btn:hover{border-color:rgba(21,94,86,.45);color:var(--accent);background:#fffefb;}
.btn svg{flex:none;}
.btn.primary{background:linear-gradient(180deg,#1a6a60,#14574f);border-color:#124d46;color:#f6fbf8;box-shadow:0 1px 2px rgba(13,63,58,.25);}
.btn.primary:hover{background:linear-gradient(180deg,#1d7368,#156055);color:#fff;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
.btn.ghost:hover{background:rgba(31,35,40,.05);color:var(--ink);}
.btn.danger{color:var(--danger);border-color:#e6cfc8;}
.btn.danger:hover{background:#fbf1ee;border-color:#d9b3a8;color:var(--danger);}
.btn.sm{height:28px;padding:0 9px;font-size:11.5px;border-radius:7px;}
.icon-btn{
  width:28px;height:28px;border:none;background:transparent;border-radius:7px;color:var(--muted);
  display:grid;place-items:center;cursor:pointer;padding:0;transition:all .15s;
}
.icon-btn:hover{background:rgba(31,35,40,.06);color:var(--ink);}
.icon-btn.danger:hover{background:#f8eae6;color:var(--danger);}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:0 1px 2px rgba(31,35,40,.025);}
.card.tight{padding:16px 18px;}
.card + .card{margin-top:14px;}
.hero{
  position:relative;overflow:hidden;border-radius:16px;padding:32px 34px;margin-bottom:16px;
  background:linear-gradient(135deg,#fcfaf3 0%,#f2eee1 55%,#e9efe9 100%);
  border:1px solid var(--line);
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(21,94,86,.09),rgba(21,94,86,0) 70%);
}
.hero h2{font-size:25px;line-height:1.4;max-width:620px;}
.hero p{font-size:12.5px;color:var(--ink-2);margin-top:10px;max-width:620px;line-height:1.85;}
.hero .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.stat{padding:15px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,253,248,.7);}
.stat b{display:block;font-family:var(--serif);font-size:24px;line-height:1.2;color:var(--ink);}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.03em;}
.stat.accent b{color:var(--accent);}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 22px;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  padding:9px 14px;font-size:12.8px;color:var(--muted);cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;
  background:none;border-top:none;border-left:none;border-right:none;
}
.tab:hover{color:var(--ink);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab .idx{font-family:var(--serif);font-size:11px;margin-right:4px;opacity:.75;}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field:last-child{margin-bottom:0;}
.field > label{font-size:11px;letter-spacing:.07em;color:var(--muted);display:flex;justify-content:space-between;gap:10px;}
.field > label em{font-style:normal;color:#b3ab99;font-size:10.5px;}
input[type=text],input[type=url],textarea,select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fcfbf6;
  font-family:var(--sans);font-size:13.2px;line-height:1.7;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input[type=text]:focus,input[type=url]:focus,textarea:focus,select:focus{
  border-color:rgba(21,94,86,.5);background:#fff;box-shadow:0 0 0 3px rgba(21,94,86,.075);
}
input::placeholder,textarea::placeholder{color:#b6afa0;}
textarea{resize:vertical;min-height:78px;}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8b8577 50%),linear-gradient(135deg,#8b8577 50%,transparent 50%);
  background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}

/* ---------- question blocks ---------- */
.q-block{padding:18px 0;border-bottom:1px dashed var(--line);}
.q-block:first-of-type{padding-top:4px;}
.q-block:last-of-type{border-bottom:none;padding-bottom:4px;}
.q-head{display:flex;gap:10px;align-items:flex-start;}
.q-num{
  width:23px;height:23px;flex:none;border-radius:50%;border:1px solid rgba(21,94,86,.32);color:var(--accent);
  display:grid;place-items:center;font-family:var(--serif);font-size:11px;margin-top:2px;
}
.q-label{font-size:14.5px;font-weight:600;line-height:1.55;color:var(--ink);}
.q-hint{font-size:11.8px;color:var(--muted);line-height:1.7;padding-left:33px;margin:5px 0 9px;}
.q-body{padding-left:33px;}
.q-body textarea{min-height:74px;}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#faf7ef;color:var(--ink-2);white-space:nowrap;}
.badge.ok{background:#e9f3ee;border-color:#c8e0d4;color:#1c6350;}
.badge.mid{background:#fbf3e2;border-color:#ecd9b7;color:#8a621c;}
.badge.neutral{background:#f2f0ea;border-color:#e0dbcd;color:#6f695c;}
.badge.no{background:#faeeea;border-color:#eccfc5;color:#9a4030;}
.badge.bad{background:#f7e6e2;border-color:#e2bdb2;color:#8e2f1f;}
.badge.gold{background:#f8f0e1;border-color:#e7d4b3;color:#8a6329;}
.badge.plain{background:transparent;}

/* ---------- progress ---------- */
.prog{height:6px;border-radius:999px;background:#eae4d6;overflow:hidden;}
.prog > i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1b6a5f,#4f9c8a);transition:width .35s;}
.prog-row{display:flex;align-items:center;gap:12px;}
.prog-row .prog{flex:1;}
.prog-row b{font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:34px;text-align:right;}
.step-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.step-pill{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px;background:rgba(255,255,255,.5);}
.step-pill.done{color:var(--accent);border-color:#c8ded6;background:#ecf4f0;}

/* ---------- paper view ---------- */
.paper-title{font-size:28px;line-height:1.38;margin-top:2px;}
.paper-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:9px;}
.paper-meta span{display:inline-flex;align-items:center;gap:4px;}
.paper-meta span + span::before{content:"·";margin-right:12px;color:#c3baa6;}
.paper-top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;}
.paper-top .page-actions{padding-top:4px;}
.prog-card{margin:18px 0 20px;padding:14px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(255,253,248,.6);}

/* ---------- detail blocks ---------- */
.block-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;}
.block-head h3{font-size:16px;line-height:1.4;}
.block-head .sub{font-size:11.5px;color:var(--muted);margin-top:3px;font-family:var(--sans);}
.divider{height:1px;background:var(--line);margin:20px 0;}
.mini-list{display:flex;flex-direction:column;gap:8px;}
.mini-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fdfbf5;font-size:12.5px;cursor:pointer;}
.mini-row:hover{border-color:rgba(21,94,86,.35);}
.mini-row .ok{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:#fff;font-size:9px;flex:none;}
.mini-row .ok.on{background:var(--accent);border-color:var(--accent);}
.mini-row .go{margin-left:auto;color:var(--muted);font-size:11px;}

.item-card{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:#fdfbf6;margin-bottom:12px;}
.item-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.item-head .idx{font-family:var(--serif);font-size:12px;color:var(--gold);letter-spacing:.06em;flex:none;white-space:nowrap;}
.item-head .grow{flex:1;}
.item-tools{display:flex;gap:2px;}
.item-card .field{margin-bottom:11px;}
.item-card .field:last-child{margin-bottom:0;}
.item-card textarea{min-height:68px;background:#fffdf8;}
.item-head .figure-ref{width:120px;flex:none;}
.verdict-select{width:118px;height:32px;font-size:11.5px;padding:6px 26px 6px 9px;}

/* ---------- table ---------- */
.table-wrap{border:1px solid var(--line);border-radius:12px;overflow:auto;background:var(--card);}
table.ev{width:100%;border-collapse:collapse;min-width:820px;table-layout:fixed;}
table.ev th:nth-child(1),table.ev td:nth-child(1){width:8%;}
table.ev th:nth-child(2),table.ev td:nth-child(2){width:24%;}
table.ev th:nth-child(3),table.ev td:nth-child(3){width:33%;}
table.ev th:nth-child(4),table.ev td:nth-child(4){width:10%;}
table.ev th:nth-child(5),table.ev td:nth-child(5){width:9%;}
table.ev th:nth-child(6),table.ev td:nth-child(6){width:16%;}
table.ev td{overflow-wrap:anywhere;}
table.ev th{
  text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);background:#faf7ef;white-space:nowrap;
}
table.ev td{padding:11px 12px;border-bottom:1px solid #efeade;font-size:12.5px;vertical-align:top;}
table.ev tr:last-child td{border-bottom:none;}
table.ev tbody tr:hover{background:#fbf9f3;cursor:pointer;}
table.ev td.claim{min-width:200px;font-weight:500;}
table.ev td.evidence{color:var(--ink-2);white-space:pre-wrap;}

/* ---------- guide ---------- */
.guide-step{display:grid;grid-template-columns:64px 1fr;gap:18px;padding:24px 0;border-bottom:1px solid var(--line);}
.guide-step:last-child{border-bottom:none;}
.guide-num{font-family:var(--serif);font-size:34px;line-height:1;color:var(--gold);opacity:.85;}
.guide-step h3{font-size:18px;margin-bottom:4px;}
.guide-step .lead{font-size:12.5px;color:var(--muted);margin-bottom:12px;}
.guide-step p{font-size:13.2px;line-height:1.9;color:var(--ink-2);}
.guide-step p + p{margin-top:9px;}
.q-list{counter-reset:q;display:flex;flex-direction:column;gap:8px;margin:12px 0;}
.q-list .qi{display:flex;gap:10px;font-size:13px;color:var(--ink);background:#fbf8f0;border:1px solid var(--line);border-radius:9px;padding:9px 12px;line-height:1.7;}
.q-list .qi b{font-family:var(--serif);color:var(--accent);font-weight:600;flex:none;}
.quote{border-left:2px solid var(--gold);padding:2px 0 2px 14px;color:var(--ink-2);font-family:var(--serif);font-size:13.5px;line-height:1.9;margin:12px 0;}
details.note{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fcfaf4;margin:12px 0;}
details.note summary{cursor:pointer;font-size:12.8px;color:var(--accent);font-weight:500;}
details.note > div{margin-top:10px;font-size:12.8px;line-height:1.9;color:var(--ink-2);}
details.note > div p + p{margin-top:8px;}
.example-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12.5px;}
.example-table th,.example-table td{border:1px solid var(--line);padding:9px 11px;text-align:left;vertical-align:top;line-height:1.7;}
.example-table th{background:#faf7ef;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.05em;white-space:nowrap;}
.depth-row{display:grid;grid-template-columns:130px 90px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.8px;}
.depth-row:last-child{border-bottom:none;}

/* ---------- empty ---------- */
.empty{
  border:1px dashed var(--line-2);border-radius:14px;padding:48px 24px;text-align:center;
  background:rgba(255,253,248,.5);
}
.empty h3{font-size:17px;color:var(--ink-2);margin-bottom:6px;}
.empty p{font-size:12.5px;color:var(--muted);max-width:420px;margin:0 auto 16px;line-height:1.8;}

/* ---------- versions ---------- */
.version{border:1px solid var(--line);border-left:2px solid var(--gold);border-radius:10px;padding:12px 14px;background:#fdfbf6;display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.version .v-label{font-family:var(--serif);font-size:13px;color:var(--ink);}
.version .v-time{font-size:11px;color:var(--muted);}
.version .v-tools{margin-left:auto;display:flex;gap:2px;}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);z-index:200;
  background:#20242a;color:#f7f4ec;padding:10px 18px;border-radius:10px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;box-shadow:0 8px 26px rgba(0,0,0,.22);
  max-width:80vw;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

/* ---------- misc ---------- */
.muted{color:var(--muted);}
.small{font-size:11.5px;}
.hint-line{font-size:11.5px;color:var(--muted);line-height:1.75;}
.kv{display:flex;gap:10px;font-size:12.5px;line-height:1.8;}
.kv dt{color:var(--muted);min-width:66px;flex:none;}
.kv dd{margin:0;}
.print-only{display:none;}
.menu-btn{display:none;}

@media (max-width:1180px){

/* ---------- library ---------- */
.tip-line{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:9px 14px;margin-bottom:14px;border:1px solid #e8d8ba;background:#faf2e2;border-radius:10px;
  font-size:12px;color:#7d5f2c;
}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;}
.section-title h3{font-size:16px;}
.paper-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(272px,100%),1fr));gap:14px;}
.paper-card{cursor:pointer;transition:border-color .15s,transform .15s,box-shadow .15s;padding:18px 20px;}
.paper-card:hover{border-color:rgba(21,94,86,.35);box-shadow:0 3px 14px rgba(31,35,40,.06);transform:translateY(-1px);}
.pcard-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.pcard-title{font-size:14.5px;line-height:1.55;margin-top:9px;font-family:var(--sans);font-weight:600;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.pcard-meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6;}
.pcard-sec{font-size:10.5px;color:var(--gold);margin-top:8px;letter-spacing:.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pcard-foot{display:flex;align-items:center;gap:10px;margin-top:14px;}
.pcard-foot .prog{flex:1;}
.flow-card{margin-top:16px;}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;}
.flow-item{display:flex;gap:9px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfaf4;}
.flow-no{font-family:var(--serif);font-size:12px;color:var(--gold);padding-top:1px;}
.flow-item b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px;}
.flow-item span:not(.flow-no){display:block;font-size:10.8px;color:var(--muted);line-height:1.55;}

/* ---------- paper overview ---------- */
.chain-row{display:grid;grid-template-columns:26px 176px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);}
.chain-row:last-child{border-bottom:none;}
.chain-no{font-family:var(--serif);font-size:11px;color:var(--gold);}
.chain-row label{font-size:12px;color:var(--muted);}
.chain-row input{height:34px;padding:6px 10px;font-size:12.8px;}

/* ---------- outline ---------- */
.outline-sec{margin-bottom:14px;}
.outline-head{display:flex;align-items:center;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--line);}
.outline-no{font-family:var(--serif);font-size:28px;color:var(--gold);line-height:1;width:36px;flex:none;}
.outline-title{flex:1;min-width:0;}
.outline-title h3{font-size:15.5px;line-height:1.45;}
.outline-title p{font-size:11px;color:var(--muted);margin-top:2px;}
.outline-sub{padding:11px 0;border-bottom:1px dashed var(--line);}
.outline-sub:last-child{border-bottom:none;padding-bottom:2px;}
.os-head{display:flex;align-items:baseline;gap:10px;}
.os-no{font-family:var(--serif);font-size:11px;color:var(--accent);flex:none;min-width:26px;}
.os-title{font-size:12.8px;color:var(--ink);line-height:1.6;flex:1;}
.os-count{font-size:10.5px;color:var(--muted);white-space:nowrap;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;padding-left:36px;}
.chip{font-size:11px;color:var(--ink-2);background:#fbf8f0;border:1px solid var(--line);border-radius:6px;
  padding:3px 8px;cursor:pointer;max-width:330px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s;}
.chip:hover{border-color:rgba(21,94,86,.4);color:var(--accent);background:#f4f8f5;}
.chip.more{color:var(--muted);cursor:default;}

/* ---------- evidence ---------- */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.filter-bar select{width:200px;max-width:230px;height:34px;padding:4px 28px 4px 10px;font-size:12px;}
.filter-bar input{flex:1;min-width:180px;height:34px;font-size:12.5px;}
.filter-bar #evCount{white-space:nowrap;}

/* ---------- archive ---------- */
.archive-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.archive-card{padding:18px 20px;}
.archive-sum{font-size:12.5px;color:var(--ink-2);line-height:1.85;margin-top:8px;}

/* ---------- final tab ---------- */
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.check-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fcfaf4;cursor:pointer;}
.check-item:hover{border-color:rgba(21,94,86,.3);}
.check-item .box{width:16px;height:16px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;color:#fff;flex:none;}
.check-item.done .box{background:var(--accent);border-color:var(--accent);}
.ci-label{font-size:12.5px;flex:1;}
.version-view{border-color:#e7d4b3;background:#fffdf6;}
.version-pre{
  margin:0;padding:16px 18px;background:#fbf8ef;border:1px solid var(--line);border-radius:10px;
  font-family:"Cascadia Mono",Consolas,"Courier New",monospace;font-size:11.5px;line-height:1.85;color:var(--ink-2);
  max-height:440px;overflow:auto;white-space:pre-wrap;word-break:break-word;
}

/* ---------- guide extras ---------- */
.protocol-card{padding:20px 24px;background:linear-gradient(135deg,#fdfbf4,#f4f1e5);}
.protocol-flow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--serif);font-size:15px;color:var(--ink);}
.protocol-flow i{font-style:normal;color:var(--gold);}
.protocol-note{font-size:11.5px;color:var(--muted);margin-top:10px;}
.logic-list{display:flex;flex-direction:column;gap:2px;}
.logic-list > div{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.logic-list > div:last-child{border-bottom:none;}
.logic-list b{font-family:var(--serif);font-size:11px;color:var(--gold);flex:none;width:20px;}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.rules > div{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fcfaf4;}
.rules b{display:block;font-family:var(--serif);font-size:12px;color:var(--accent);margin-bottom:5px;}
.rules p{font-size:12px;color:var(--ink-2);line-height:1.8;}

/* ---------- settings ---------- */
.q-edit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);}
.q-edit:last-child{border-bottom:none;}
.q-edit-fields{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;}
.q-edit-fields input[type=text]{height:33px;padding:5px 10px;font-size:12.8px;}
.q-edit-fields .hint-input{font-size:11.3px;color:var(--muted);background:transparent;border-color:transparent;padding-left:2px;}
.q-edit-fields .hint-input:focus{background:#fff;border-color:rgba(21,94,86,.4);}
.sub-head{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:4px 0 2px;font-family:var(--sans);font-weight:500;}
.data-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.data-item{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fcfaf4;}
.data-item b{display:block;font-family:var(--serif);font-size:19px;line-height:1.3;color:var(--ink);}
.data-item span{font-size:10.5px;color:var(--muted);}
.settings-outline{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px;}
.settings-outline:last-child{border-bottom:none;}
.settings-outline b{font-family:var(--serif);color:var(--gold);font-size:11px;width:16px;flex:none;}
.settings-outline span:nth-child(2){flex:1;color:var(--ink-2);}


@media (max-width:980px){
  .save-state{display:none;}
  .topbar{padding:0 14px;gap:10px;}
  .brand h1{font-size:15px;}
  .brand p{display:none;}
  .brand .mark{width:32px;height:32px;}
  .brand > div:last-child{min-width:0;}
  .top-actions{gap:6px;}
}
@media (max-width:560px){
  .top-actions .btn{display:none;}
  .paper-meta span + span::before{content:none;margin:0;}
  .paper-title{font-size:21px;}
  .page-title{font-size:23px;}
  .hero h2{font-size:20px;}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr));}
  .flow-item{min-width:0;}
  .item-head{gap:6px;}
  .item-head .figure-ref{width:96px;}
  .item-head .verdict-select{width:100px;}
}

@media print{
  body{background:#fff;}
  .topbar,.sidebar,.tabs,.page-actions,.no-print,#toast,.menu-btn{display:none !important;}
  main{max-width:none;padding:0;}
  .print-only{display:block !important;}
  .card,.item-card,.version{box-shadow:none;break-inside:avoid;}
  .print-only h1{font-size:22px;margin-bottom:6px;}
  .print-only h2{font-size:15px;margin:18px 0 6px;padding-bottom:4px;border-bottom:1px solid #ddd;}
  .print-only h3{font-size:13px;margin:12px 0 4px;}
  .print-only p{font-size:12px;line-height:1.8;}
}

/* ---------- 工具函数 ---------- */
function uid(prefix) {
  return (prefix || 'id') + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
}
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtDateTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function relTime(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  if (diff < 60e3) return '刚刚';
  if (diff < 3600e3) return Math.floor(diff / 60e3) + ' 分钟前';
  if (diff < 86400e3) return Math.floor(diff / 3600e3) + ' 小时前';
  if (diff < 7 * 86400e3) return Math.floor(diff / 86400e3) + ' 天前';
  return fmtDateTime(ts).slice(0, 10);
}
function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2400);
}
function download(filename, text, mime) {
  const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 400);
}
function setPath(obj, path, value) {
  const parts = path.split('.');
  let o = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (o[parts[i]] == null || typeof o[parts[i]] !== 'object') o[parts[i]] = {};
    o = o[parts[i]];
  }
  o[parts[parts.length - 1]] = value;
}
function countFilled(obj, keys) {
  let n = 0;
  keys.forEach(k => { if (String((obj && obj[k]) || '').trim()) n++; });
  return n;
}
function safeName(s) {
  return String(s || '未命名文献').replace(/[\\/:*?"<>|\n\r\t]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 70);
}

function allSections() {
  const out = [];
  (state.outline || []).forEach(sec => {
    (sec.subs || []).forEach(sub => out.push({ id: sub.id, no: sub.no, title: sub.title, parent: sec }));

}
function secLabel(id) {
  if (!id) return '';
  const s = allSections().find(x => x.id === id);
  return s ? s.no + ' ' + s.title : id;

function sectionOptions(selected) {
  return allSections().map(s =>
    '<option value="' + esc(s.id) + '"' + (s.id === selected ? ' selected' : '') + '>' + esc(s.no + ' ' + s.title) + '</option>'

}

function migrate(s) {
  if (!s.questions) s.questions = clone(DEFAULT_QUESTIONS);
  if (!s.questions.step1) s.questions.step1 = clone(DEFAULT_QUESTIONS.step1);
  if (!s.questions.step2) s.questions.step2 = clone(DEFAULT_QUESTIONS.step2);
  if (!s.outline || !s.outline.length) s.outline = clone(DEFAULT_OUTLINE);
  if (!s.settings) s.settings = { lastBackup: null };
  s.papers.forEach(p => {
    p.meta = p.meta || {};
    p.meta.tags = p.meta.tags || [];
    p.step1 = p.step1 || {};
    p.step2 = p.step2 || {};
    p.chain = p.chain || {};
    p.limits = p.limits || {};
    p.final = p.final || {};
    p.figures = p.figures || [];
    p.methods = p.methods || [];
    p.claims = p.claims || [];
    p.versions = p.versions || [];
    p.status = p.status || '在读';
  });
  return s;
}

/* ---------- 进度 ---------- */
function paperProgress(p) {
  const ids1 = (state.questions.step1 || []).map(q => q.id);
  const f1 = countFilled(p.step1, ids1);
  const figDone = p.figures.filter(f => f.change && f.measure && f.result).length;
  const methodDone = p.methods.filter(m => m.name && m.name.trim()).length;
  const claimDone = p.claims.filter(c => c.claim && c.evidence).length;
  const s5 = (p.limits.cannot && p.limits.judgment) ? 1 : 0;
  const s6 = (p.final.summary || p.final.takeaway) ? 1 : 0;
  const steps = [
    { key: 'step1', label: '初读', done: f1 >= 4, detail: f1 + '/4 问' },
    { key: 'step2', label: '读图', done: figDone >= 1, detail: figDone + ' 图' },
    { key: 'step3', label: '方法', done: methodDone >= 1, detail: methodDone + ' 项' },
    { key: 'step4', label: '论据', done: claimDone >= 1, detail: claimDone + ' 条' },
    { key: 'step5', label: '边界', done: !!s5, detail: s5 ? '已写' : '待写' },
    { key: 'final', label: '定稿', done: !!s6, detail: s6 ? '已写' : '待写' }
  ];
  const doneCount = steps.filter(s => s.done).length;
  return { steps: steps, pct: Math.round(doneCount / steps.length * 100), doneCount: doneCount };
}

/* ---------- Markdown 导出 ---------- */
function paperMarkdown(p) {
  const m = p.meta || {};
  const L = [];
  L.push('# ' + (m.title || '未命名文献'));
  const meta = [];
  if (m.authors) meta.push('作者：' + m.authors);
  if (m.journal) meta.push('期刊：' + m.journal);
  if (m.year) meta.push('年份：' + m.year);
  if (m.doi) meta.push('DOI：' + m.doi);
  if (m.tags && m.tags.length) meta.push('标签：' + m.tags.join('、'));
  if (m.section) meta.push('对应章节：' + secLabel(m.section));
  meta.push('状态：' + (p.status || '在读'));
  L.push(meta.join(' ｜ '));
  L.push('');

  const q1 = (state.questions.step1 || []);
  const any1 = q1.some(q => String(p.step1[q.id] || '').trim());
  if (any1 || p.step1.summary) {
    L.push('## 一、初读（Abstract + Introduction）');
    q1.forEach((q, i) => {
      const v = String(p.step1[q.id] || '').trim();
      if (!v) return;
      L.push('**Q' + (i + 1) + ' ' + q.label + '**');
      L.push(v);
      L.push('');
    });
    if (p.step1.summary) { L.push('**一句话总结**'); L.push(p.step1.summary); L.push(''); }
  }

  if (p.figures.length) {
    L.push('## 二、读图');
    p.figures.forEach((f, i) => {
      L.push('### 图 ' + (i + 1) + (f.ref ? ' · ' + f.ref : ''));
      const q2 = state.questions.step2 || [];
      q2.forEach(q => {
        const v = String(f[q.id] || '').trim();
        if (v) L.push('- ' + q.label + ' ' + v);
      });
      if (f.verdict) L.push('- 证据判断：' + f.verdict);
      L.push('');
    });
  }

  if (p.methods.length) {
    L.push('## 三、方法（只记设计策略，不复述制备流程）');
    L.push('| 方法 / 参数 | 重要度 | 作用与设计策略 |');
    L.push('| --- | --- | --- |');
    p.methods.forEach(x => {
      L.push('| ' + (x.name || '') + ' | ' + (x.depth || '') + ' | ' + String(x.role || '').replace(/\n/g, ' ') + ' |');
    });
    L.push('');
  }

  if (p.claims.length) {
    L.push('## 四、转化为论据');
    p.claims.forEach((c, i) => {
      L.push('### Claim ' + (i + 1));
      L.push('- Claim：' + (c.claim || ''));
      L.push('- 证据：' + String(c.evidence || '').replace(/\n/g, ' '));
      L.push('- 来源：' + (c.source || ''));
      L.push('- 证据判断：' + (c.verdict || ''));
      if (c.section) L.push('- 对应章节：' + secLabel(c.section));
      L.push('');
    });
  }

  const lim = p.limits || {};
  if (lim.cannot || lim.gap || lim.judgment || lim.todo) {
    L.push('## 五、边界：这篇论文不能证明什么');
    if (lim.cannot) { L.push('**不能证明**'); L.push(lim.cannot); L.push(''); }
    if (lim.gap) { L.push('**实验与结论之间的缺口**'); L.push(lim.gap); L.push(''); }
    if (lim.judgment) { L.push('**我的判断 / 引用方式**'); L.push(lim.judgment); L.push(''); }
    if (lim.todo) { L.push('**待查证**'); L.push(lim.todo); L.push(''); }
  }

  const ch = p.chain || {};
  if (ch.material || ch.problem || ch.principle || ch.proof || ch.role) {
    L.push('## 逻辑链');
    if (ch.material) L.push('- 选择什么材料 / 结构：' + ch.material);
    if (ch.problem) L.push('- 解决什么问题：' + ch.problem);
    if (ch.principle) L.push('- 设计原理：' + ch.principle);
    if (ch.proof) L.push('- 实验如何证明：' + ch.proof);
    if (ch.role) L.push('- 为综述提供什么：' + ch.role);
    L.push('');
  }

  if (p.final.summary || p.final.takeaway) {
    L.push('## 定稿');
    if (p.final.takeaway) { L.push('**一句话带走**'); L.push(p.final.takeaway); L.push(''); }
    if (p.final.summary) { L.push('**综合评述**'); L.push(p.final.summary); L.push(''); }
  }
  return L.join('\n');
}

    + '导出时间：' + fmtDateTime(Date.now()) + ' ｜ 共 ' + state.papers.length + ' 篇\n\n---\n\n';

function evidenceMarkdown() {
  const rows = collectClaims(ui.evSection, ui.evVerdict, ui.evQuery);
  const bySec = {};
  rows.forEach(r => {
    const k = r.claim.section || 'unassigned';
    (bySec[k] = bySec[k] || []).push(r);
  });
  const L = ['# 证据总表', '', '导出时间：' + fmtDateTime(Date.now()), ''];
  Object.keys(bySec).forEach(k => {
    L.push('## ' + (k === 'unassigned' ? '未归类' : secLabel(k)));
    bySec[k].forEach(r => {
      L.push('- **Claim**：' + r.claim.claim);
      L.push('  - 证据：' + String(r.claim.evidence || '').replace(/\n/g, ' '));
      L.push('  - 来源：' + (r.claim.source || '') + '（' + r.paperTitle + '）');
      L.push('  - 判断：' + (r.claim.verdict || ''));
    });
    L.push('');
  });
  return L.join('\n');
}

function collectClaims(section, verdict, query) {
  const q = String(query || '').toLowerCase();
  const out = [];
  state.papers.forEach(p => {
    p.claims.forEach(c => {
      if (section !== 'all' && c.section !== section) return;
      if (verdict !== 'all' && c.verdict !== verdict) return;
      if (q) {
        const hay = (c.claim + ' ' + c.evidence + ' ' + (c.source || '') + ' ' + (p.meta.title || '')).toLowerCase();
        if (!hay.includes(q)) return;
      }
      out.push({ claim: c, paper: p, paperTitle: p.meta.title || '未命名文献' });
    });
  });
  return out;
}

  if (m.journal) meta.push(m.journal);
  if (m.year) meta.push(m.year);
  if (m.doi) meta.push('DOI ' + m.doi);
  h.push('<p class="muted small">' + esc(meta.join(' · ')) + '</p>');
  if (m.section) h.push('<p class="small">对应章节：' + esc(secLabel(m.section)) + '</p>');

  const q1 = state.questions.step1 || [];
  const any1 = q1.some(q => String(p.step1[q.id] || '').trim());
  if (any1) {
    h.push('<h2>一、初读</h2>');
    q1.forEach((q, i) => {
      const v = String(p.step1[q.id] || '').trim();
      if (!v) return;
      h.push('<h3>Q' + (i + 1) + ' ' + esc(q.label) + '</h3><p>' + esc(v).replace(/\n/g, '<br>') + '</p>');
    });
  }
  if (p.figures.length) {
    h.push('<h2>二、读图</h2>');
    p.figures.forEach((f, i) => {
      h.push('<h3>图 ' + (i + 1) + (f.ref ? ' · ' + esc(f.ref) : '') + '</h3>');
      (state.questions.step2 || []).forEach(q => {
        const v = String(f[q.id] || '').trim();
        if (v) h.push('<p><b>' + esc(q.label) + '</b> ' + esc(v).replace(/\n/g, '<br>') + '</p>');
      });
      if (f.verdict) h.push('<p><b>证据判断</b> ' + esc(f.verdict) + '</p>');
    });
  }
  if (p.methods.length) {
    h.push('<h2>三、方法</h2>');
    p.methods.forEach(x => h.push('<p><b>' + esc(x.name) + '</b>（' + esc(x.depth) + '）：' + esc(x.role) + '</p>'));
  }
  if (p.claims.length) {
    h.push('<h2>四、论据</h2>');
    p.claims.forEach((c, i) => {
      h.push('<h3>Claim ' + (i + 1) + '</h3>');
      h.push('<p>' + esc(c.claim) + '</p>');
      h.push('<p><b>证据</b> ' + esc(c.evidence).replace(/\n/g, '<br>') + '</p>');
      h.push('<p><b>来源</b> ' + esc(c.source) + ' ｜ <b>判断</b> ' + esc(c.verdict) + '</p>');
    });
  }
  const lim = p.limits || {};
  if (lim.cannot || lim.gap || lim.judgment) {
    h.push('<h2>五、边界</h2>');
    if (lim.cannot) h.push('<p><b>不能证明</b> ' + esc(lim.cannot).replace(/\n/g, '<br>') + '</p>');
    if (lim.gap) h.push('<p><b>缺口</b> ' + esc(lim.gap).replace(/\n/g, '<br>') + '</p>');
    if (lim.judgment) h.push('<p><b>判断</b> ' + esc(lim.judgment).replace(/\n/g, '<br>') + '</p>');
  }
  if (p.final.summary) {
    h.push('<h2>定稿</h2><p>' + esc(p.final.summary).replace(/\n/g, '<br>') + '</p>');
  }
  return h.join('\n');
}

/* ---------- 版本 ---------- */
function makeSnapshot(p, label) {
  const data = clone(p);
  data.versions = [];
  return { id: uid('v'), ts: Date.now(), label: label, data: data };
}
function saveVersion(p) {
  const label = 'v' + (p.versions.length + 1) + ' · 定稿';
  p.versions.unshift(makeSnapshot(p, label));
  p.status = '已定稿';
  p.updatedAt = Date.now();
  saveNow();
  toast('已保存 ' + label + '，历史版本已留档');
}

function renderPaperList() {

/* ---------------- 视图切换 ---------------- */
function renderMain() {
  const main = document.getElementById('main');
  let html = '';
  if (ui.view === 'paper') {
    if (!currentPaper()) { ui.view = 'library'; }
  }
  switch (ui.view) {
    case 'library': html = viewLibrary(); break;
    case 'paper': html = viewPaper(); break;
    case 'guide': html = viewGuide(); break;
    case 'outline': html = viewOutline(); break;
    case 'evidence': html = viewEvidence(); break;
    case 'archive': html = viewArchive(); break;
    case 'settings': html = viewSettings(); break;
    default: html = viewLibrary();
  }
  main.innerHTML = html;
  document.querySelectorAll('#main textarea').forEach(autoGrow);
}

function renderAll(opts) {
  renderNav();
  renderPaperList();
  const y = window.scrollY;
  renderMain();
  if (opts && opts.keepScroll) window.scrollTo(0, y);
}

function autoGrow(el) {
  if (!el || el.tagName !== 'TEXTAREA') return;
  el.style.height = 'auto';
  el.style.height = Math.min(Math.max(el.scrollHeight + 2, 70), 560) + 'px';
}

/* ---------------- 第二步 ---------------- */
function paperStep2(p) {
  const qs = state.questions.step2;
  const items = p.figures.map((f, i) =>
    '<div class="item-card">'
    + '<div class="item-head"><span class="idx">图 ' + (i + 1) + '</span>'
    + '<input type="text" class="figure-ref" data-arr="figures" data-idx="' + i + '" data-k="ref" value="' + esc(f.ref) + '" placeholder="Figure 2G">'

    + '<div class="grow"></div><div class="item-tools">'
    + '<button class="icon-btn" data-action="move-figure" data-idx="' + i + '" data-dir="-1" title="上移">' + icon('up', 14) + '</button>'

      + '<textarea data-arr="figures" data-idx="' + i + '" data-k="' + q.id + '" placeholder="' + esc(q.hint || '') + '">' + esc(f[q.id]) + '</textarea></div>').join('')
    + '</div>').join('');

  return '<section class="card">'
    + '<div class="block-head"><div><h3>先图后文：一张主图一张记录</h3>'
    + '<div class="sub">只回答“变什么 / 测什么 / 说明什么 / 支撑哪个观点”，不要把图注抄一遍。</div></div>'
    + '<button class="btn sm" data-action="add-figure">' + icon('plus', 13) + ' 加一张图</button></div>'
    + (p.figures.length ? items : '<div class="empty" style="padding:30px"><p>还没有记录。打开论文的第一张主图，从 Figure 1 开始。</p>'
      + '<button class="btn primary" data-action="add-figure">' + icon('plus', 14) + ' 加第一张图</button></div>')
    + '</section>';
}

/* ---------------- 第三步 ---------------- */
function paperStep3(p) {
  const items = p.methods.map((m, i) =>
    '<div class="item-card">'
    + '<div class="item-head"><span class="idx">M' + (i + 1) + '</span>'
    + '<input type="text" data-arr="methods" data-idx="' + i + '" data-k="name" value="' + esc(m.name) + '" placeholder="方法 / 参数 / 材料（如 静电纺丝）" style="flex:1">'
    + '<select class="verdict-select" data-arr="methods" data-idx="' + i + '" data-k="depth">'
    + DEPTHS.map(d => '<option' + (m.depth === d ? ' selected' : '') + '>' + d + '</option>').join('') + '</select>'
    + '<div class="item-tools">'
    + '<button class="icon-btn" data-action="move-method" data-idx="' + i + '" data-dir="-1" title="上移">' + icon('up', 14) + '</button>'
    + '<button class="icon-btn" data-action="move-method" data-idx="' + i + '" data-dir="1" title="下移">' + icon('down', 14) + '</button>'
    + '<button class="icon-btn danger" data-action="del-method" data-idx="' + i + '" title="删除">' + icon('trash', 14) + '</button>'
    + '</div></div>'
    + '<div class="field"><label>它解决什么 / 背后的设计策略 <em>不写操作步骤</em></label>'
    + '<textarea data-arr="methods" data-idx="' + i + '" data-k="role" placeholder="例：决定纤维直径与孔隙，从而同时影响厚度、力学与透气">' + esc(m.role) + '</textarea></div>'
    + '</div>').join('');

  return '<section class="card">'
    + '<div class="block-head"><div><h3>最后再看 Methods：只记设计策略</h3>'
    + '<div class="sub">“非常值得”认真记；“值得了解”记一句；“暂时不必深入”留个名字即可。</div></div>'
    + '<button class="btn sm" data-action="add-method">' + icon('plus', 13) + ' 加一项</button></div>'
    + (p.methods.length ? items : '<div class="empty" style="padding:30px"><p>把这篇论文的关键工艺、参数、材料列出来，按重要度分级。</p>'
      + '<button class="btn primary" data-action="add-method">' + icon('plus', 14) + ' 加第一项</button></div>')
    + '<div class="quote" style="margin-top:16px">综述不是把每篇论文的制备方法重新写一遍，而是总结不同制备方法背后的设计策略。</div>'
    + '</section>';
}

/* ---------------- 第四步 ---------------- */
function paperStep4(p) {
  const items = p.claims.map((c, i) =>
    '<div class="item-card">'
    + '<div class="item-head"><span class="idx">CLAIM ' + (i + 1) + '</span><div class="grow"></div><div class="item-tools">'
    + '<button class="icon-btn" data-action="move-claim" data-idx="' + i + '" data-dir="-1" title="上移">' + icon('up', 14) + '</button>'
    + '<button class="icon-btn" data-action="move-claim" data-idx="' + i + '" data-dir="1" title="下移">' + icon('down', 14) + '</button>'
    + '<button class="icon-btn danger" data-action="del-claim" data-idx="' + i + '" title="删除">' + icon('trash', 14) + '</button>'
    + '</div></div>'
    + '<div class="field"><label>Claim <em>一句可以写进综述的话</em></label>'
    + '<textarea data-arr="claims" data-idx="' + i + '" data-k="claim" placeholder="例：超薄多孔结构可以改善柔性电子设备的可呼吸性">' + esc(c.claim) + '</textarea></div>'
    + '<div class="field"><label>证据 <em>数字 / 现象 / 对照实验</em></label>'
    + '<textarea data-arr="claims" data-idx="' + i + '" data-k="evidence" placeholder="例：厚度约 10 μm；WVTR 1669.3 ± 23.5 g·m⁻²·day⁻¹">' + esc(c.evidence) + '</textarea></div>'
    + '<div class="grid-3">'
    + '<div class="field"><label>来源</label><input type="text" data-arr="claims" data-idx="' + i + '" data-k="source" value="' + esc(c.source) + '" placeholder="Figure 2G；Results"></div>'
    + '<div class="field"><label>证据判断</label><select data-arr="claims" data-idx="' + i + '" data-k="verdict">'
    + VERDICTS.map(v => '<option' + (c.verdict === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select></div>'
    + '<div class="field"><label>对应章节</label><select data-arr="claims" data-idx="' + i + '" data-k="section"><option value="">未归类</option>'
    + sectionOptions(c.section) + '</select></div>'

  return '<section class="card">'
    + '<div class="block-head"><div><h3>把论文转化为论据</h3>'

    + '<button class="btn sm" data-action="add-claim">' + icon('plus', 13) + ' 加一条</button></div>'
    + (p.claims.length ? items : '<div class="empty" style="padding:30px"><p>读完之后，用一句 Claim 说清“这篇论文能支撑我综述里的哪句话”。</p>'
      + '<button class="btn primary" data-action="add-claim">' + icon('plus', 14) + ' 写第一条</button></div>')
    + '</section>';
}

/* ---------------- 第五步 ---------------- */
function paperStep5(p) {
  return '<section class="card">'
    + '<div class="block-head"><div><h3>这篇论文不能证明什么</h3>'
    + '<div class="sub">不要只看作者的结论，要看实验究竟检查了什么。没检查的，先别当成已证明。</div></div></div>'
    + '<div class="field"><label>不能证明什么 <em>逐条写</em></label>'
    + '<textarea data-f="limits.cannot" style="min-height:110px" placeholder="例：WVTR 只说明水蒸气能穿过，不能证明防风、防水、汗液长期浸泡稳定性、皮肤炎症……">' + esc(p.limits.cannot) + '</textarea></div>'
    + '<div class="grid-2">'
    + '<div class="field"><label>实验与结论之间的缺口</label>'
    + '<textarea data-f="limits.gap" placeholder="作者声称 A，但实验只测了 B……">' + esc(p.limits.gap) + '</textarea></div>'
    + '<div class="field"><label>我的判断 / 引用时的边界</label>'
    + '<textarea data-f="limits.judgment" placeholder="它能支撑什么、不能支撑什么，写综述时怎么限定语气">' + esc(p.limits.judgment) + '</textarea></div>'
    + '</div>'

    + '<div class="quote">判断规则：作者说自己证明了 A。回到实验，问一句“这个实验真的测试了 A 吗？”如果没有，就只能说“它证明了与 A 相关的某个环节”。</div>'
    + '</section>';
}

/* ---------------- 定稿 ---------------- */

  const checklist = '<section class="card">'

    + '<div class="checklist">' + pr.steps.map(s =>
      '<div class="check-item' + (s.done ? ' done' : '') + '" data-action="tab" data-tab="' + s.key + '">'

      + '<span class="ci-label">' + s.label + '</span><span class="small muted">' + s.detail + '</span></div>').join('')
    + '</div></section>';

  const versions = '<section class="card">'
    + '<div class="block-head"><div><h3>历史定稿</h3><div class="sub">每次保存都会新增一个版本，旧版本不会被覆盖</div></div>'
    + '<span class="badge">' + p.versions.length + ' 个版本</span></div>'
    + (p.versions.length ? p.versions.map(x =>
      '<div class="version"><span class="v-label">' + esc(x.label) + '</span>'
      + '<span class="v-time">' + fmtDateTime(x.ts) + '</span>'
      + '<div class="v-tools">'
      + '<button class="btn sm ghost" data-action="view-version" data-id="' + x.id + '">回看</button>'
      + '<button class="btn sm ghost" data-action="restore-version" data-id="' + x.id + '">恢复</button>'
      + '<button class="icon-btn danger" data-action="delete-version" data-id="' + x.id + '" title="删除该版本">' + icon('trash', 13) + '</button>'
      + '</div></div>').join('')
      : '<p class="small muted">还没有定稿版本。点上方“保存定稿”，就会留下第一个版本。</p>')
    + '</section>';

  const viewer = v
    ? '<section class="card version-view"><div class="block-head"><div><h3>' + esc(v.label) + '</h3>'

/* ============ 视图：阅读方法 / 大纲 / 证据 / 定稿库 / 设置 ============ */

    + '<details class="note"><summary>用一把伞理解这件事</summary><div>'

    + '</section>'

    + '<section class="card">'
    + '<div class="block-head"><div><h3>每篇论文的五个逻辑问题</h3><div class="sub">与“概览”页的逻辑链一一对应</div></div></div>'

    + '</section>';
}

/* ---------------- 大纲地图 ---------------- */
function viewOutline() {
  const claimMap = {};
  const paperMap = {};
  state.papers.forEach(p => {
    const k = p.meta.section || '';
    (paperMap[k] = paperMap[k] || []).push(p);
    p.claims.forEach(c => {
      const ck = c.section || '';
      (claimMap[ck] = claimMap[ck] || []).push({ c: c, p: p });
    });
  });
  const totalClaims = state.papers.reduce((n, p) => n + p.claims.length, 0);

  const sections = (state.outline || []).map(sec => {
    const rows = sec.subs.map(sub => {
      const claims = claimMap[sub.id] || [];
      const papers = paperMap[sub.id] || [];
      return '<div class="outline-sub">'
        + '<div class="os-head"><span class="os-no">' + esc(sub.no) + '</span>'
        + '<span class="os-title">' + esc(sub.title) + '</span>'
        + '<span class="os-count">' + (claims.length ? claims.length + ' 条证据' : '暂无证据')
        + (papers.length ? ' · ' + papers.length + ' 篇' : '') + '</span></div>'
        + (claims.length ? '<div class="chips">' + claims.slice(0, 6).map(x =>
          '<span class="chip" data-action="open-paper" data-id="' + x.p.id + '" data-tab="step4">'
          + esc(x.c.claim.length > 46 ? x.c.claim.slice(0, 46) + '…' : x.c.claim) + '</span>').join('')
          + (claims.length > 6 ? '<span class="chip more">+' + (claims.length - 6) + '</span>' : '') + '</div>' : '')
        + '</div>';
    }).join('');
    const secClaims = sec.subs.reduce((n, s) => n + (claimMap[s.id] || []).length, 0);
    return '<section class="card outline-sec">'
      + '<div class="outline-head"><span class="outline-no">' + esc(sec.no) + '</span>'
      + '<div class="outline-title"><h3>' + esc(sec.title) + '</h3>'
      + '<p>' + sec.subs.length + ' 个小节 · ' + secClaims + ' 条证据</p></div>'
      + (secClaims ? '<span class="badge">' + Math.round(secClaims / Math.max(totalClaims, 1) * 100) + '%</span>' : '<span class="small muted">待补充</span>') + '</div>'
      + rows + '</section>';
  }).join('');

  const unassigned = claimMap[''] || [];
  const unassignedHtml = unassigned.length
    ? '<section class="card"><div class="block-head"><div><h3>未归类证据</h3><div class="sub">给这些 Claim 选一个章节，它们就会出现在对应位置</div></div>'
    + '<span class="badge no">' + unassigned.length + ' 条</span></div><div class="chips">'
    + unassigned.map(x => '<span class="chip" data-action="open-paper" data-id="' + x.p.id + '" data-tab="step4">'
      + esc(x.c.claim.slice(0, 42) || '未写 Claim') + '</span>').join('') + '</div></section>'
    : '';

  return '<div class="page-head"><div><div class="eyebrow">Outline Map</div>'
    + '<h2 class="page-title">大纲地图</h2>'
    + '<p class="page-sub">6 章 26 小节，来自你的综述初步想法。每一条证据落在哪一节，一眼可见。</p></div>'
    + '<div class="page-actions"><button class="btn" data-action="export-evidence">' + icon('download', 14) + ' 导出证据表</button></div></div>'
    + sections + unassignedHtml;
}

/* ---------------- 证据总表 ---------------- */
function evidenceRowsHTML(rows) {
  if (!rows.length) {
    return '<tr><td colspan="6"><div class="empty" style="border:none;background:transparent;padding:36px">'
      + '<h3>还没有符合条件的证据</h3><p>在文献的“④ 论据”里写 Claim，并选好对应章节。</p></div></td></tr>';
  }
  return rows.map(r =>
    '<tr data-action="open-paper" data-id="' + r.paper.id + '" data-tab="step4">'
    + '<td class="small muted"><span title="' + esc(r.claim.section ? secLabel(r.claim.section) : '未归类') + '">' + esc(r.claim.section || '—') + '</span></td>'
    + '<td class="claim">' + esc(r.claim.claim) + '</td>'
    + '<td class="evidence">' + esc(r.claim.evidence) + '</td>'
    + '<td class="small">' + esc(r.claim.source || '') + '</td>'
    + '<td><span class="badge ' + (VERDICT_CLASS[r.claim.verdict] || 'neutral') + '">' + esc(r.claim.verdict || '') + '</span></td>'
    + '<td class="small" title="' + esc(r.paper.meta.title) + '">' + esc((r.paper.meta.title || '').length > 26 ? (r.paper.meta.title || '').slice(0, 26) + '…' : (r.paper.meta.title || '')) + '</td>'
    + '</tr>').join('');
}

function renderEvidenceBody() {
  const rows = collectClaims(ui.evSection, ui.evVerdict, ui.evQuery);
  const tb = document.getElementById('evBody');
  if (tb) tb.innerHTML = evidenceRowsHTML(rows);
  const c = document.getElementById('evCount');
  if (c) c.textContent = rows.length + ' 条证据';
}

function viewEvidence() {
  const rows = collectClaims(ui.evSection, ui.evVerdict, ui.evQuery);
  return '<div class="page-head"><div><div class="eyebrow">Evidence Table</div>'
    + '<h2 class="page-title">证据总表</h2>'
    + '<p class="page-sub">所有论文的 Claim 按章节汇总。写作时直接从这张表里取句子和出处。</p></div>'
    + '<div class="page-actions"><button class="btn" data-action="export-evidence">' + icon('download', 14) + ' 导出 Markdown</button></div></div>'
    + '<div class="filter-bar">'
    + '<select data-ui="evSection"><option value="all">全部章节</option>' + sectionOptions(ui.evSection) + '</select>'
    + '<select data-ui="evVerdict"><option value="all">全部判断</option>' + VERDICTS.map(v => '<option' + (ui.evVerdict === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>'
    + '<input id="evSearch" type="text" placeholder="搜索 Claim、证据或文献" value="' + esc(ui.evQuery) + '">'
    + '<span id="evCount" class="small muted">' + rows.length + ' 条证据</span>'
    + '</div>'
    + '<div class="table-wrap"><table class="ev"><thead><tr>'
    + '<th>章节</th><th>Claim</th><th>证据</th><th>来源</th><th>判断</th><th>文献</th>'
    + '</tr></thead><tbody id="evBody">' + evidenceRowsHTML(rows) + '</tbody></table></div>';
}

/* ---------------- 定稿库 ---------------- */
function viewArchive() {
  const list = state.papers.filter(p => p.status === '已定稿' || p.versions.length)
    .sort((a, b) => b.updatedAt - a.updatedAt);
  const cards = list.map(p => {
    const latest = p.versions[0];
    const summary = p.final.summary || p.final.takeaway || '';
    return '<article class="card archive-card">'
      + '<div class="pcard-head"><span class="badge ok">已定稿</span>'
      + '<span class="small muted">' + p.versions.length + ' 个版本 · ' + esc(relTime(p.updatedAt)) + '</span></div>'
      + '<h3 class="pcard-title">' + esc(p.meta.title || '未命名文献') + '</h3>'
      + '<p class="archive-sum">' + esc(summary.length > 150 ? summary.slice(0, 150) + '…' : (summary || '还没有写综合评述。')) + '</p>'
      + '<div class="pcard-sec">' + esc(p.meta.section ? secLabel(p.meta.section) : '未归类章节') + '</div>'
      + '<div class="page-actions" style="justify-content:flex-start;margin-top:12px">'
      + '<button class="btn sm" data-action="open-paper" data-id="' + p.id + '" data-tab="final">打开</button>'

      + '</div></article>';
  }).join('');

  return '<div class="page-head"><div><div class="eyebrow">Final Archive</div>'
    + '<h2 class="page-title">定稿库</h2>'
    + '<p class="page-sub">每次点击“保存定稿”都会留一个版本；这里保存每一次的最终成果。</p></div>'
    + '<div class="page-actions"><button class="btn" data-action="export-all">' + icon('download', 14) + ' 导出全书</button></div></div>'
    + (list.length ? '<div class="archive-grid">' + cards + '</div>'
      : emptyBlock('还没有定稿', '在任意文献的“定稿”页点击“保存定稿”，这里就会留下一个可回看的版本。',
        '<button class="btn primary" data-action="nav" data-view="library">去文献库</button>'));
}

    + '<div class="data-grid">'
    + '<div class="data-item"><b>' + state.papers.length + '</b><span>文献</span></div>'
    + '<div class="data-item"><b>' + state.papers.reduce((n, p) => n + p.claims.length, 0) + '</b><span>论据</span></div>'

    + '<div class="block-head"><div><h3>综述大纲</h3><div class="sub">来自《综述初步想法》，是 Claim 归类的依据</div></div>'
    + '<span class="badge">6 章</span></div>'
    + state.outline.map(sec => '<div class="settings-outline"><b>' + esc(sec.no) + '</b><span>' + esc(sec.title) + '</span>'
      + '<span class="small muted">' + sec.subs.length + ' 小节</span></div>').join('')
    + '</section>';

    + '<div class="block-head"><div><h3>关于</h3><div class="sub">Breathable Systems · 文献精读工作台 v' + APP_VERSION + '</div></div></div>'
    + '<p class="hint-line">离线单文件应用，不需要联网、不需要安装。全部数据保存在浏览器 localStorage；清除浏览器数据会一并清除，请定期备份。</p>'
    + '<p class="hint-line" style="margin-top:6px">快捷键：Ctrl / Cmd + S 保存当前文献的定稿版本。</p>'
    + '<div class="divider"></div>'

/* ============ 交互 ============ */

function closeSidebar() {
  ui.sidebarOpen = false;
  const sb = document.getElementById('sidebar');
  if (sb) sb.classList.remove('open');
}

function applyPaperField(el) {
  const p = currentPaper();
  if (!p) return;
  if (el.dataset.f) {
    let v = el.value;
    if (el.dataset.f === 'meta.tags') {
      v = v.split(/[,，;；]/).map(s => s.trim()).filter(Boolean);
    }
    if (el.dataset.f === 'meta.title') {
      const h = document.querySelector('.paper-title');
      if (h) h.textContent = v.trim() || '未命名文献';
    }
    setPath(p, el.dataset.f, v);
  } else if (el.dataset.arr) {
    const arr = p[el.dataset.arr];
    if (!arr || !arr[+el.dataset.idx]) return;
    arr[+el.dataset.idx][el.dataset.k] = el.value;
  }
  p.updatedAt = Date.now();
  saveSoon();
  updateLiveProgress();
  if (el.dataset.f === 'status' || el.dataset.f === 'meta.section' || el.dataset.f === 'meta.title') {
    renderPaperList();
  }
  if (el.dataset.f === 'status' || el.dataset.f === 'meta.section') {
    renderAll({ keepScroll: true });
  }
}

function updateLiveProgress() {
  if (ui.view !== 'paper') return;
  const p = currentPaper();
  if (!p) return;
  const pr = paperProgress(p);
  document.querySelectorAll('[data-prog-bar]').forEach(b => { b.style.width = pr.pct + '%'; });
  document.querySelectorAll('[data-prog-text]').forEach(t => { t.textContent = pr.pct + '%'; });
  document.querySelectorAll('[data-step-pill]').forEach(el => {
    const s = pr.steps.find(x => x.key === el.dataset.stepPill);
    if (!s) return;
    el.classList.toggle('done', s.done);
    el.textContent = s.label + ' · ' + s.detail;
  });
}

function copyText(t) {
  const done = () => toast('已复制 Markdown 到剪贴板');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t));
  } else {
    fallbackCopy(t);
  }
}
function fallbackCopy(t) {
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制 Markdown 到剪贴板'); }
  catch (e) { toast('复制失败，请改用导出'); }
  document.body.removeChild(ta);
}

function doAction(action, el) {
  const p = currentPaper();
  switch (action) {
    case 'toggle-sidebar': {
      ui.sidebarOpen = !ui.sidebarOpen;
      document.getElementById('sidebar').classList.toggle('open', ui.sidebarOpen);
      break;
    }
    case 'nav': {
      ui.view = el.dataset.view;
      ui.versionView = null;
      closeSidebar();
      renderAll();
      window.scrollTo(0, 0);
      break;
    }
    case 'open-paper': {
      ui.paperId = el.dataset.id;
      ui.view = 'paper';
      ui.tab = el.dataset.tab || 'overview';
      ui.versionView = null;
      closeSidebar();
      renderAll();
      window.scrollTo(0, 0);
      break;
    }
    case 'new-paper': {
      const np = {
        id: uid('p'), createdAt: Date.now(), updatedAt: Date.now(), status: '在读',
        meta: { title: '', authors: '', journal: '', year: '', doi: '', link: '', tags: [], section: '' },
        step1: {}, chain: {}, figures: [], methods: [], claims: [], limits: {}, final: {}, versions: []
      };
      state.papers.unshift(np);
      ui.paperId = np.id; ui.view = 'paper'; ui.tab = 'overview'; ui.versionView = null;
      saveNow();
      renderAll();
      window.scrollTo(0, 0);
      setTimeout(() => {
        const t = document.querySelector('[data-f="meta.title"]');
        if (t) { t.focus(); t.select(); }
      }, 60);
      break;
    }
    case 'load-demo': {
      if (state.papers.some(x => x.id === 'demo_hydrogel')) { toast('示例已经在文献库里了'); break; }
      const d = buildDemoPaper();
      state.papers.unshift(d);
      ui.paperId = d.id; ui.view = 'paper'; ui.tab = 'overview'; ui.versionView = null;
      saveNow(); renderAll();
      window.scrollTo(0, 0);
      toast('已载入示例，可以照着改，也可以随时删除');
      break;
    }
    case 'delete-paper': {
      if (!p) break;
      if (!confirm('删除《' + (p.meta.title || '未命名文献') + '》？\n该文献的所有记录与历史版本都会消失，且不可撤销。')) break;
      state.papers = state.papers.filter(x => x.id !== p.id);
      ui.view = 'library'; ui.paperId = null;
      saveNow(); renderAll(); window.scrollTo(0, 0);
      toast('已删除');
      break;
    }
    case 'tab': {
      ui.tab = el.dataset.tab;
      ui.versionView = null;
      renderMain();
      break;
    }
    case 'add-figure': {
      if (!p) break;
      p.figures.push({ id: uid('fig'), ref: '', change: '', measure: '', result: '', claim: '', verdict: '直接支持' });
      p.updatedAt = Date.now(); saveNow(); renderMain(); updateLiveProgress();
      break;
    }
    case 'del-figure': {
      if (!p) break;
      p.figures.splice(+el.dataset.idx, 1);
      p.updatedAt = Date.now(); saveNow(); renderMain(); updateLiveProgress();
      break;
    }
    case 'move-figure': moveItem(p, 'figures', +el.dataset.idx, +el.dataset.dir); break;
    case 'add-method': {
      if (!p) break;
      p.methods.push({ id: uid('m'), name: '', depth: '值得了解', role: '' });
      p.updatedAt = Date.now(); saveNow(); renderMain(); updateLiveProgress();
      break;
    }
    case 'del-method': {
      if (!p) break;
      p.methods.splice(+el.dataset.idx, 1);
      p.updatedAt = Date.now(); saveNow(); renderMain(); updateLiveProgress();
      break;
    }
    case 'move-method': moveItem(p, 'methods', +el.dataset.idx, +el.dataset.dir); break;
    case 'add-claim': {
      if (!p) break;
      p.claims.push({ id: uid('c'), claim: '', evidence: '', source: '', verdict: '直接支持', section: p.meta.section || '' });
      p.updatedAt = Date.now(); saveNow(); renderMain(); updateLiveProgress();
      break;
    }
    case 'del-claim': {
      if (!p) break;
      p.claims.splice(+el.dataset.idx, 1);
      p.updatedAt = Date.now(); saveNow(); renderMain(); updateLiveProgress();
      break;
    }
    case 'move-claim': moveItem(p, 'claims', +el.dataset.idx, +el.dataset.dir); break;

    case 'save-version': {
      if (!p) break;
      saveVersion(p);
      ui.versionView = null;
      renderAll({ keepScroll: true });
      break;
    }
    case 'view-version': {
      ui.versionView = el.dataset.id;
      ui.tab = 'final';
      renderMain();
      break;
    }
    case 'close-version': {
      ui.versionView = null;
      renderMain();
      break;
    }
    case 'restore-version': {
      if (!p) break;
      const v = p.versions.find(x => x.id === el.dataset.id);
      if (!v) break;
      if (!confirm('恢复「' + v.label + '」（' + fmtDateTime(v.ts) + '）？\n当前内容会被替换，但历史版本仍全部保留。')) break;
      const versions = p.versions;
      const data = clone(v.data);
      Object.keys(p).forEach(k => { if (k !== 'versions') delete p[k]; });
      Object.assign(p, data);
      p.versions = versions;
      p.updatedAt = Date.now();
      ui.versionView = null;
      saveNow(); renderAll({ keepScroll: true });
      toast('已恢复到 ' + v.label);
      break;
    }
    case 'delete-version': {
      if (!p) break;
      const v = p.versions.find(x => x.id === el.dataset.id);
      if (!v) break;
      if (!confirm('删除版本「' + v.label + '」？')) break;
      p.versions = p.versions.filter(x => x.id !== v.id);
      if (ui.versionView === v.id) ui.versionView = null;
      saveNow(); renderMain();
      break;
    }

    case 'export-paper': {
      const target = el.dataset.id ? state.papers.find(x => x.id === el.dataset.id) : p;
      if (!target) break;
      download(safeName(target.meta.title) + '.md', paperMarkdown(target), 'text/markdown');
      toast('已导出 Markdown');
      break;
    }
    case 'export-all': {
      download('文献精读总表_' + fmtDateTime(Date.now()).slice(0, 10) + '.md', allMarkdown(), 'text/markdown');
      toast('已导出全书 Markdown');
      break;
    }
    case 'export-evidence': {
      download('证据总表_' + fmtDateTime(Date.now()).slice(0, 10) + '.md', evidenceMarkdown(), 'text/markdown');
      toast('已导出证据表');
      break;
    }
    case 'backup': {
      const payload = { app: 'breathable-systems-workbench', version: 1, exportedAt: Date.now(), data: state };
      download('文献工作台备份_' + fmtDateTime(Date.now()).slice(0, 10) + '.json', JSON.stringify(payload, null, 2), 'application/json');
      state.settings.lastBackup = Date.now();
      saveNow(); renderMain();
      toast('备份文件已生成');
      break;
    }
    case 'import': {
      document.getElementById('fileInput').click();
      break;
    }
    case 'copy-md': {
      if (!p) break;
      copyText(paperMarkdown(p));
      break;
    }
    case 'print': {
      window.print();
      break;
    }
    case 'reset-questions': {
      if (!confirm('恢复默认的固定问题？已有的回答不会丢失，只是问题文字回到初始版本。')) break;
      state.questions = clone(DEFAULT_QUESTIONS);
      saveNow(); renderMain();
      toast('已恢复默认问题');
      break;
    }
    case 'clear-demo': {
      if (!confirm('删除示例文献？你自己的数据不受影响。')) break;
      state.papers = state.papers.filter(x => x.id !== 'demo_hydrogel');
      if (ui.paperId === 'demo_hydrogel') { ui.paperId = null; ui.view = 'library'; }
      saveNow(); renderAll();
      toast('示例已删除');
      break;
    }
    case 'clear-all': {
      if (!confirm('清空全部文献、论据与历史版本？此操作不可撤销。建议先备份。')) break;
      if (!confirm('再确认一次：真的清空全部数据？')) break;
      state = defaultState();
      state.papers = [];
      ui.paperId = null; ui.view = 'library';
      saveNow(); renderAll();
      toast('已清空');
      break;
    }
    default: break;
  }
}

function moveItem(p, key, idx, dir) {
  if (!p) return;
  const arr = p[key];
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  const tmp = arr[idx];
  arr[idx] = arr[j];
  arr[j] = tmp;
  p.updatedAt = Date.now();
  saveNow(); renderMain(); updateLiveProgress();
}

function onInput(e) {
  const el = e.target;
  if (el.id === 'search') {
    ui.search = el.value;
    renderPaperList();
    return;
  }
  if (el.id === 'evSearch') {
    ui.evQuery = el.value;
    renderEvidenceBody();
    return;
  }
  if (el.dataset.q) {
    const parts = el.dataset.q.split('.');
    const group = state.questions[parts[0]];
    const item = group && group[+parts[1]];
    if (item) { item[parts[2]] = el.value; saveSoon(); }
    return;
  }
  if (el.dataset.f || el.dataset.arr) {
    applyPaperField(el);
    autoGrow(el);
  }
}

function onChange(e) {
  const el = e.target;
  if (el.dataset.ui === 'evSection') {
    ui.evSection = el.value;
    renderEvidenceBody();
    return;
  }
  if (el.dataset.ui === 'evVerdict') {
    ui.evVerdict = el.value;
    renderEvidenceBody();
    return;
  }
  if (el.dataset.f || el.dataset.arr) {
    applyPaperField(el);
  }
}

function onImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      const data = parsed.data || parsed;
      if (!data || !Array.isArray(data.papers)) throw new Error('文件里没有找到文献数据');
      if (!confirm('从备份恢复会覆盖当前全部数据（当前 ' + state.papers.length + ' 篇，备份 ' + data.papers.length + ' 篇）。\n建议先备份当前数据。继续？')) return;
      state = migrate(data);
      ui.paperId = null; ui.view = 'library'; ui.versionView = null;
      saveNow(); renderAll();
      toast('恢复完成，共 ' + state.papers.length + ' 篇文献');
    } catch (err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
}

function init() {
  state = loadState();
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el) { e.preventDefault(); doAction(el.dataset.action, el); return; }
    if (ui.sidebarOpen && !e.target.closest('#sidebar') && !e.target.closest('[data-action="toggle-sidebar"]')) {
      closeSidebar();
    }
  });
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.getElementById('fileInput').addEventListener('change', onImportFile);
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 's') {
      if (ui.view === 'paper' && currentPaper()) {
        e.preventDefault();
        saveVersion(currentPaper());
        renderAll({ keepScroll: true });
      }
    }
  });
  renderAll();
  updateSaveLabel('本地自动保存');
}

init();

</script>
</body>
</html>
